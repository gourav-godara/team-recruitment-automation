name: Backend CI Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Pytest Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Test Suite
        env:
          DATABASE_URL: sqlite:///./recruitment.db
          DEBUG: "true"
        run: |
          PYTHONPATH=backend/data_processing:backend python -m pytest backend/tests backend/data_processing/tests -v
