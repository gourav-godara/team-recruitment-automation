version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/backend/recruitment.db
      - DEBUG=true
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    restart: unless-stopped
